
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="zhichaoxi2006"

description='''
Bulk Cell Tweaks adds the Bulk Cell Marker, a ME network block for managing the filters of every
MEGA Cells Bulk Cell mounted in your network — drives, ME chests, and cell docks alike — from a
single GUI. Mark cells by hand, auto-mark all empty cells by the amount of items in your network,
transfer items into their matching bulk cells, and install or remove compression cards on the spot.
'''

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="megacells"
    type="required"
    versionRange="[4.11,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="guideme"
    type="required"
    versionRange="[21.1,)"
    ordering="AFTER"
    side="BOTH"
